name: Release

# Push a tag like v0.1.0 to build Linux and Windows binaries and attach them
# to a GitHub release. "Run workflow" (manual) only builds and uploads the
# packages as workflow artifacts, without creating a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          # Oldest available Ubuntu: the binary needs this glibc or newer
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Third-party license notices
        run: cargo about generate --locked --fail --target ${{ matrix.target }} about.hbs -o THIRD-PARTY-LICENSES.html

      - name: Package
        run: |
          version=${GITHUB_REF_NAME#v}
          [[ $GITHUB_REF == refs/tags/* ]] || version=${GITHUB_SHA::7}
          name=bibi-brightness-$version-${{ matrix.platform }}
          mkdir -p "$name" dist
          cp LICENSE README.md THIRD-PARTY-LICENSES.html "$name"/
          if [[ $RUNNER_OS == Windows ]]; then
            cp target/${{ matrix.target }}/release/brightness.exe "$name"/
            7z a -tzip "dist/$name.zip" "$name"
          else
            cp target/${{ matrix.target }}/release/brightness brightness.desktop "$name"/
            mkdir -p "$name"/assets && cp assets/icon.png "$name"/assets/
            tar czf "dist/$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
