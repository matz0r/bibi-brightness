[package]
name = "brightness"
version = "0.6.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/matz0r/bibi-brightness"

[dependencies]
# Linux: /dev/i2c-*, Windows: dxva2. No NVAPI backend: on NVIDIA cards it would
# list every monitor a second time next to dxva2.
ddc-hi = { version = "0.4.1", default-features = false, features = ["ddc-i2c", "ddc-winapi"] }
# glow (OpenGL) renderer instead of the default wgpu: smaller binary, works on older GPUs/VMs
eframe = { version = "0.37.0", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }

# Tray icon over D-Bus (StatusNotifierItem), no GTK needed. image is already
# pulled in by eframe; here it scales the icon for the panel.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
image = { version = "0.25", default-features = false, features = ["png"] }

# Tray icon in the notification area; tray-icon's own Linux backend (GTK) is
# not used, Linux has ksni above. windows-sys for the message loop, the
# single-instance event and the autostart registry value.
[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# Embeds assets/icon.ico into brightness.exe (see build.rs)
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
